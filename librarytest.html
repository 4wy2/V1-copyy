<script>
'use strict';
/* =====================================================================
   CONFIGURATION — the only part you normally edit
   ---------------------------------------------------------------------
   MODE     'demo' : sample data built into this file (for previewing the
                     interface). Nothing is fetched from Google.
            'live' : real folders and files, read through your Google Apps
                     Script web app (see apps-script/Code.gs + SETUP guide).
   API_URL  The Apps Script web-app URL (ends with /exec). It is a public
            endpoint, NOT a secret: no API keys or OAuth tokens live here.
   ROOTS    The five department folders. Keep these IDs identical to
            ROOT_FOLDERS in Code.gs — the backend refuses anything else.
   BLOCKED  Folder/file names that are never shown, even if the backend
            returned them (second line of defence; Code.gs filters first).
   ===================================================================== */
const CONFIG = {
  MODE: 'live',
  API_URL: 'https://script.google.com/macros/s/AKfycbzG7li4LSknw4fayEBGeEre9_N_iQyg3Ufs1vXRNp2bPsBSnn4Hmc-LO8aB96R7QvrW/exec',
  REQUEST_TIMEOUT_MS: 25000,
  PREVIEW_FALLBACK_MS: 12000,
  ROOTS: [
    {id:'1tTYloDY7RScDAApOMlxT_qdwFbMs5Az8', ar:'الهندسة الكهربائية',             en:'Electrical Engineering',        sub:'EE · Electrical Engineering'},
    {id:'1fvnC8RDQKNupmP3cKimyTPQvIcL-51nm', ar:'تقنية القوى الكهربائية',          en:'Electrical Power Technology',   sub:'EPT · Electrical Power Technology'},
    {id:'1ekjjn7udol0HOc_8TPhUgzwCxSpGC9uL', ar:'تقنية الإلكترونيات والاتصالات',   en:'Electronics & Communication',   sub:'ECT · Electronics & Communication'},
    {id:'1HuKz2Ps1qxkd9wGey2pZEq89zDCPjaa_', ar:'تقنية الآلات الدقيقة والتحكم',    en:'Instrumentation & Control',     sub:'ICT · Instrumentation & Control'},
    {id:'1LadMkd2tw3SYTmDJcDJnETwk99vf4rc0', ar:'تقنية الميكاترونيكس',             en:'Mechatronics',                  sub:'MCT · Mechatronics'}
  ],
  BLOCKED: [/^\s*00(\s|[-–_.]|$)/, /pending\s*review/i, /^[_.~]/, /\bprivate\b/i, /قيد\s*المراجعة/, /خاص/]
};

/* ===== Demo data =====================================================
   Folder IDs below are the real ones from the original page (departments,
   EE courses and their four categories). Every FILE is invented sample
   data, marked demo:true and labelled "[DEMO]" — none of it exists on
   Google Drive. A "00 – Pending Review" folder is included on purpose to
   show that it is filtered out.                                        */
const DEMO_COURSES = [
  ['1IVp3Hx3WmhrofMMCNm8ulqE984H9Tbe7','EE202 – Electronics I',['1DdqhfU4_-T6h4kitX_4Dh9y-uMkJtadj','1dJl9JODlhgnomQ_DuZeZbh_mEx8bqU-p','1zwOaxKQE7_eL-2Y3fyhb_rcA7wsy5C2T','1MHzmhElMqbtkC0vCZVFTkmmvSw93d8xN']],
  ['1KFNKlVwVH7ainF0lPLDa0tV219bC0Fz2','EE204 – Signals and Systems',['1ihr2X6e1wKd5YUwTuuPStJbnqQyxw_qt','1T2MtgyyEeuLPzgypbRTrL4TcPutGL7cT','1VulPnbGaqI5nXVQAzlTfT_f5O13pV_Ew','1SoxdUVzvxyrP07zz6I7iOs6alYPTY8Av']],
  ['1BcaW2pWwJopTQydS6DPhe9bpk2otz2Ub','EE302 – Electrical Energy Engineering',['15EGGdlMB6-1gj_jnDqCloD65isgtqLfI','1gnkbyRT2_Cnj13nHqTkDJdo65_7zYNcM','1PjkSkZtupJnqfHTgorU4-ofOWGHc1I5l','18ejLI-0gHxkaiDX7jkkYhSOUp7IDsS7-']],
  ['10PmMkBI9fASDneHCu30gopDd2d1y8RDy','EE304 – Control Systems',['1UT-7XWKcY2kymcDVmUcaLaF8gqOanuUM','13ARqkXaFNcYerlAfIjW3R-mQxaLK6zy5','1hHwuwAnyFhsbQ9j2iNqSUG-JGFeF2Itr','1eOjsEXPDhRIIf2GZ6-3cVN7yHtvTaGMa']]
];
const DEMO_CATS = ['01 – Lectures','02 – Summaries','03 – Assignments','04 – Quizzes & Exams'];
function buildDemoIndex(){
  const nodes = [], ee = CONFIG.ROOTS[0].id;
  const day = (n) => new Date(Date.UTC(2026, 8, 1 + n, 9, 30)).toISOString();
  let n = 0;
  const file = (parent, name, mime, size, extra) => nodes.push(Object.assign({id:'demo-file-' + (++n), parent, kind:'file', name, mime, size, modified:day(n % 40), public:true, demo:true}, extra || {}));
  DEMO_COURSES.forEach(([cid, cname, cats], ci) => {
    const code = cname.split(' ')[0];
    nodes.push({id:cid, parent:ee, kind:'folder', name:cname, modified:day(ci)});
    cats.forEach((id, k) => nodes.push({id, parent:cid, kind:'folder', name:DEMO_CATS[k], modified:day(ci + k)}));
    file(cats[0], `[DEMO] ${code} Lecture 01 - Introduction.pdf`, 'application/pdf', 1840000);
    file(cats[0], `[DEMO] ${code} Lecture 02.pdf`, 'application/pdf', 2310000);
    file(cats[0], `[DEMO] ${code} Lecture slides.pptx`, 'application/vnd.openxmlformats-officedocument.presentationml.presentation', 5400000);
    file(cats[1], `[DEMO] ${code} Summary sheet.pdf`, 'application/pdf', 640000);
    file(cats[1], `[DEMO] ${code} Notes.docx`, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 220000);
    if (ci !== 3) file(cats[2], `[DEMO] ${code} Assignment 1.pdf`, 'application/pdf', 410000);
    if (ci === 1) {
      file(cats[3], '[DEMO] EE204 Midterm Spring 26 (solution).pdf', 'application/pdf', 980000);
      file(cats[3], '[DEMO] EE204 Formula sheet.png', 'image/png', 350000);
      file(cats[3], '[DEMO] EE204 Restricted file (not shared).pdf', 'application/pdf', 300000, {public:false});
    }
  });
  // Must never appear: filtered by isBlocked()
  nodes.push({id:'demo-pending', parent:ee, kind:'folder', name:'00 – Pending Review', modified:day(3)});
  file('demo-pending', '[DEMO] Unreviewed upload.pdf', 'application/pdf', 100000);
  return {ok:true, demo:true, generated:new Date().toISOString(), nodes, errors:[]};
}

/* ===== State ===== */
const $ = (id) => document.getElementById(id);
let lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
const t = (k, ...a) => { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const store = { byId:new Map(), kids:new Map(), status:'loading', error:null, generated:null, demo:false, rootErrors:new Map() };
let currentId = 'root', previewTimer = null, previewUrl = null;

/* ===== Helpers ===== */
const norm = (s) => String(s || '').toLowerCase().replace(/[\s\-–—_·.()[\]]/g, '');
const isBlocked = (name) => CONFIG.BLOCKED.some((r) => r.test(String(name || '')));
const ROOT_IDS = new Set(CONFIG.ROOTS.map((r) => r.id));
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of children) if (c != null) e.append(c);
  return e;
}
function ext(n){ const m = /\.([a-z0-9]{1,5})$/i.exec(n.name || ''); if (m) return m[1].toLowerCase();
  const map = {'application/pdf':'pdf','application/vnd.google-apps.document':'gdoc','application/vnd.google-apps.presentation':'gslides','application/vnd.google-apps.spreadsheet':'gsheet'}; return map[n.mime] || 'file'; }
function kindClass(x){ if (x === 'pdf') return 'pdf'; if (/^(docx?|gdoc|odt|rtf|txt)$/.test(x)) return 'doc'; if (/^(pptx?|gslides|key|odp)$/.test(x)) return 'ppt'; if (/^(xlsx?|csv|gsheet|ods)$/.test(x)) return 'xls'; if (/^(png|jpe?g|gif|webp|svg|heic)$/.test(x)) return 'img'; return ''; }
function fmtSize(b){ if (!b) return ''; return b < 1e6 ? Math.max(1, Math.round(b / 1e3)) + ' ' + t('kb') : (b / 1e6).toFixed(1) + ' ' + t('mb'); }
function fmtDate(iso){ if (!iso) return ''; try { return new Intl.DateTimeFormat(lang === 'ar' ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB', {year:'numeric', month:'short', day:'numeric'}).format(new Date(iso)); } catch (e) { return iso.slice(0, 10); } }
function fmtTime(iso){ try { return new Intl.DateTimeFormat(lang === 'ar' ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB', {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'}).format(new Date(iso)); } catch (e) { return ''; } }
const deptOf = (id) => CONFIG.ROOTS.find((r) => r.id === id);
function titleOf(id){ if (id === 'root') return t('root'); const d = deptOf(id); if (d) return d[lang]; const n = store.byId.get(id); return n ? n.name : ''; }
function pathTo(id){ const out = []; let cur = id, guard = 0; while (cur && cur !== 'root' && guard++ < 30) { out.unshift(cur); if (ROOT_IDS.has(cur)) break; const n = store.byId.get(cur); cur = n && n.parent; } return ['root', ...out]; }
const driveFileUrl = (id) => 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view';
const drivePreviewUrl = (id) => 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/preview';
const driveDownloadUrl = (id) => 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id);

/* ===== Data loading ===== */
function ingest(index){
  if (!index || index.ok !== true || !Array.isArray(index.nodes)) throw Object.assign(new Error('bad'), {code:'bad'});
  store.byId.clear(); store.kids.clear(); store.rootErrors.clear();
  const accepted = new Map();
  for (const n of index.nodes) {
    if (!n || typeof n.id !== 'string' || typeof n.parent !== 'string' || (n.kind !== 'file' && n.kind !== 'folder')) continue;
    if (isBlocked(n.name)) continue;
    accepted.set(n.id, n);
  }
  // Keep only nodes whose whole ancestry leads to a configured root through accepted folders
  const ok = (n, guard = 0) => guard < 30 && (ROOT_IDS.has(n.parent) || (accepted.has(n.parent) && accepted.get(n.parent).kind === 'folder' && ok(accepted.get(n.parent), guard + 1)));
  for (const n of accepted.values()) if (!ROOT_IDS.has(n.id) && ok(n)) {
    store.byId.set(n.id, n);
    if (!store.kids.has(n.parent)) store.kids.set(n.parent, []);
    store.kids.get(n.parent).push(n);
  }
  for (const list of store.kids.values()) list.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'folder' ? -1 : 1) || a.name.localeCompare(b.name, undefined, {numeric:true}));
  for (const e of index.errors || []) if (e && ROOT_IDS.has(e.root)) store.rootErrors.set(e.root, e.error || 'access');
  store.generated = index.generated || new Date().toISOString();
  store.demo = !!index.demo;
}
async function load(refresh){
  store.status = 'loading'; store.error = null; render();
  try {
    if (CONFIG.MODE === 'demo') { await new Promise((r) => setTimeout(r, 350)); ingest(buildDemoIndex()); }
    else {
      if (!CONFIG.API_URL) throw Object.assign(new Error('config'), {code:'config'});
      const url = CONFIG.API_URL + (CONFIG.API_URL.includes('?') ? '&' : '?') + 'action=index' + (refresh ? '&refresh=1' : '');
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS);
      let res;
      try { res = await fetch(url, {signal:ctrl.signal, credentials:'omit', redirect:'follow'}); }
      catch (e) { throw Object.assign(new Error('network'), {code:'network'}); }
      finally { clearTimeout(timer); }
      if (!res.ok) throw Object.assign(new Error('http'), {code: res.status === 403 || res.status === 401 ? 'denied' : 'network'});
      let data; try { data = await res.json(); } catch (e) { throw Object.assign(new Error('bad'), {code:'bad'}); }
      if (data && data.ok === false) throw Object.assign(new Error(data.error || 'bad'), {code: data.error === 'access' ? 'denied' : 'bad'});
      ingest(data);
    }
    store.status = 'ready';
  } catch (e) { store.status = 'error'; store.error = e.code || 'network'; }
  route();
}

/* ===== Routing (hash keeps the phone's back button working) ===== */
function route(){
  const m = /^#\/f\/([\w-]{1,100})$/.exec(location.hash);
  currentId = m ? m[1] : 'root';
  render();
}
function go(id){ const h = id === 'root' ? '#/' : '#/f/' + id; if (location.hash !== h) location.hash = h; else route(); }
window.addEventListener('hashchange', () => { $('search').value = ''; route(); });

/* ===== Rendering ===== */
function folderCard(id, name, sub, extra){
  return el('button', {type:'button', class:'folder', onclick:() => { go(id); $('sectionTitle').scrollIntoView({block:'start', behavior:'smooth'}); }},
    el('span', {class:'ico', 'aria-hidden':'true', text:'▱'}),
    el('span', {class:'copy'}, el('strong', {text:name, dir:'auto'}), el('small', {text:sub, dir:'auto'}), extra || null),
    el('span', {class:'arr', 'aria-hidden':'true', text:'‹'}));
}
function fileRow(n, withPath){
  const x = ext(n), meta = el('span', {class:'meta'});
  if (withPath) { const p = pathTo(n.parent).slice(1).map(titleOf).join(' › '); meta.append(el('span', {class:'path', text:p, dir:'auto'})); }
  meta.append(el('span', {text:x.toUpperCase()}));
  if (n.size) meta.append(el('span', {text:fmtSize(n.size)}));
  if (n.modified) meta.append(el('span', {text:fmtDate(n.modified)}));
  if (n.demo) meta.append(el('span', {class:'badge demo', text:t('demo_badge')}));
  if (n.public === false) meta.append(el('span', {class:'badge lock', text:t('restricted')}));
  const acts = el('span', {class:'acts'},
    el('button', {type:'button', class:'btn sm', onclick:() => openPreview(n)}, t('preview')),
    n.demo ? null : el('a', {class:'btn sm', href:driveFileUrl(n.id), target:'_blank', rel:'noopener noreferrer', 'aria-label':t('open_drive') + ' ' + n.name}, t('open')));
  return el('div', {class:'file'},
    el('span', {class:'fico ' + kindClass(x), 'aria-hidden':'true', text:x.slice(0, 4)}),
    el('span', {class:'copy'}, el('button', {type:'button', class:'name', dir:'auto', onclick:() => openPreview(n)}, n.name), meta),
    acts);
}
function stateBox(kind, icon, title, text, actions){
  return el('div', {class:'state' + (kind === 'bad' ? ' bad' : ''), role: kind === 'bad' ? 'alert' : 'status'},
    el('span', {class:'big', 'aria-hidden':'true', text:icon}), el('strong', {text:title}), el('p', {text:text}), actions || null);
}
function renderModebar(){
  const mb = $('modebar'); mb.replaceChildren();
  let cls = 'modebar', html;
  if (CONFIG.MODE === 'demo') { cls += ' demo'; html = t('demo_bar'); }
  else if (store.status === 'ready') html = t('live_bar', fmtTime(store.generated));
  else { cls += ' off'; html = t('off_bar'); }
  mb.className = cls;
  const txt = el('span', {class:'grow'}); txt.innerHTML = html; // fixed strings only, no Drive data
  mb.append(el('span', {class:'dot', 'aria-hidden':'true'}), txt);
  if (CONFIG.MODE === 'live' && store.status !== 'loading') mb.append(el('button', {type:'button', class:'btn sm', id:'refresh', onclick:() => load(true)}, t('refresh')));
  const d = $('details'); d.replaceChildren(
    el('span', {}, el('b', {text:'●'}), ' ', CONFIG.MODE === 'demo' ? t('d_demo') : store.status === 'ready' ? t('d_live') : t('d_off')),
    el('span', {text:'AL-RASSASI · Academic Tools'}));
}
function render(){
  renderModebar();
  $('howto').innerHTML = t('howto'); // fixed string
  const cards = $('cards'), files = $('files'), state = $('state'), note = $('resultsNote');
  cards.replaceChildren(); files.replaceChildren(); state.replaceChildren();
  cards.classList.remove('hidden'); files.classList.add('hidden'); state.classList.add('hidden'); note.classList.add('hidden');
  const q = $('search').value.trim();

  // Breadcrumbs
  const crumbs = $('crumbs'); crumbs.replaceChildren();
  const trail = store.status === 'ready' && (currentId === 'root' || store.byId.has(currentId) || ROOT_IDS.has(currentId)) ? pathTo(currentId) : ['root'];
  trail.forEach((id, i) => {
    if (i) crumbs.append(el('span', {class:'slash', text:'/'}));
    crumbs.append(el('button', {type:'button', dir:'auto', 'aria-current': i === trail.length - 1 ? 'page' : 'false', onclick:() => go(id)}, titleOf(id)));
  });

  const showState = (...a) => { cards.classList.add('hidden'); state.classList.remove('hidden'); state.append(stateBox(...a)); };
  const retry = el('button', {type:'button', class:'btn primary', onclick:() => load(true)}, t('retry'));

  if (store.status === 'loading') {
    $('sectionTitle').textContent = t('loading'); $('count').textContent = '';
    for (let i = 0; i < 6; i++) cards.append(el('div', {class:'skel', 'aria-hidden':'true'}));
    cards.setAttribute('aria-busy', 'true'); return;
  }
  cards.removeAttribute('aria-busy');
  if (store.status === 'error') {
    $('sectionTitle').textContent = t('depts'); $('count').textContent = '';
    const map = {network:['bad','⚠︎',t('net_t'),t('net_p'),retry], denied:['bad','🔒',t('denied_t'),t('denied_p'),null], config:['bad','⚙︎',t('cfg_t'),t('cfg_p'),null], bad:['bad','⚠︎',t('bad_t'),t('bad_p'),retry]};
    return showState(...(map[store.error] || map.network));
  }

  // Search across everything published
  if (q) {
    const nq = norm(q);
    const hit = (n) => norm(n.name).includes(nq) || (n.kind === 'file' && norm(pathTo(n.parent).map(titleOf).join(' ')).includes(nq));
    const all = [...store.byId.values()];
    const fol = all.filter((n) => n.kind === 'folder' && norm(n.name).includes(nq));
    const fil = all.filter((n) => n.kind === 'file' && hit(n));
    const deps = CONFIG.ROOTS.filter((r) => norm(r.ar + r.en + r.sub).includes(nq));
    $('sectionTitle').textContent = t('search_h');
    $('count').textContent = t('folders', fol.length + deps.length) + ' · ' + t('filesN', fil.length);
    deps.forEach((r) => cards.append(folderCard(r.id, r[lang], r.sub)));
    fol.slice(0, 60).forEach((n) => cards.append(folderCard(n.id, n.name, pathTo(n.parent).slice(1).map(titleOf).join(' › '))));
    if (fil.length) { files.classList.remove('hidden'); fil.slice(0, 200).forEach((n) => files.append(fileRow(n, true))); }
    if (!fol.length && !fil.length && !deps.length) showState('', '⌕', t('nores_t'), t('nores_p'));
    return;
  }

  // Root: departments
  if (currentId === 'root') {
    $('sectionTitle').textContent = t('depts'); $('count').textContent = t('folders', CONFIG.ROOTS.length);
    CONFIG.ROOTS.forEach((r) => {
      const err = store.rootErrors.get(r.id);
      cards.append(folderCard(r.id, r[lang], r.sub, err ? el('span', {class:'badge lock', text:t('dept_unavailable')}) : null));
    });
    return;
  }

  // Unknown or filtered folder: never reveal whether it exists
  if (!ROOT_IDS.has(currentId) && !(store.byId.has(currentId) && store.byId.get(currentId).kind === 'folder')) {
    $('sectionTitle').textContent = t('denied_t'); $('count').textContent = '';
    return showState('bad', '🔒', t('denied_t'), t('denied_p'), el('button', {type:'button', class:'btn primary', onclick:() => go('root')}, t('home_btn')));
  }
  if (ROOT_IDS.has(currentId) && store.rootErrors.has(currentId)) {
    $('sectionTitle').textContent = titleOf(currentId); $('count').textContent = '';
    return showState('bad', '🔒', t('denied_t'), t('dept_unavailable'), retry);
  }

  const kids = store.kids.get(currentId) || [];
  const fol = kids.filter((n) => n.kind === 'folder'), fil = kids.filter((n) => n.kind === 'file');
  $('sectionTitle').textContent = titleOf(currentId);
  $('count').textContent = [fol.length ? t('folders', fol.length) : '', fil.length ? t('filesN', fil.length) : ''].filter(Boolean).join(' · ');
  fol.forEach((n) => { const sub = (store.kids.get(n.id) || []); const nf = sub.filter((x) => x.kind === 'folder').length, nfi = sub.length - nf;
    cards.append(folderCard(n.id, n.name, nf ? t('folders', nf) + (nfi ? ' · ' + t('filesN', nfi) : '') : nfi ? t('filesN', nfi) : t('open_folder'))); });
  if (!fol.length) cards.classList.add('hidden');
  if (fil.length) { files.classList.remove('hidden'); files.append(el('h3', {text:t('files_h')})); fil.forEach((n) => files.append(fileRow(n, false))); }
  if (!kids.length) showState('', '📂', t('empty_t'), t('empty_p'));
}

/* ===== Preview ===== */
function demoDoc(n){
  // Demo preview is a small HTML page (works on every browser, unlike PDF-in-iframe on Android).
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ar = lang === 'ar';
  return '<!doctype html><html lang="' + lang + '" dir="' + (ar ? 'rtl' : 'ltr') + '"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>body{margin:0;background:#e9e8e5;font:15px/1.7 system-ui,sans-serif;color:#292e34;padding:24px}.page{max-width:720px;margin:auto;background:#fff;border-radius:6px;padding:40px 36px;box-shadow:0 2px 12px #0002}' +
    '.tag{display:inline-block;background:#f4e7cf;color:#7a5414;font-weight:700;font-size:12px;padding:3px 10px;border-radius:5px}h1{font-size:22px;margin:16px 0 6px;unicode-bidi:plaintext}p{color:#55606b}.bar{height:10px;background:#eceae5;border-radius:4px;margin:14px 0}.bar.s{width:70%}.bar.m{width:85%}</style>' +
    '<div class="page"><span class="tag">' + (ar ? 'معاينة تجريبية' : 'DEMO PREVIEW') + '</span><h1>' + esc(n.name) + '</h1><p>' +
    (ar ? 'هذا محتوى تجريبي مولّد داخل الصفحة وليس ملفًا حقيقيًا من Google Drive. في الوضع المباشر يظهر الملف الحقيقي هنا عبر عارض Google.' : 'This is generated sample content, not a real Google Drive file. In live mode the real file appears here through Google’s viewer.') +
    '</p><div class="bar"></div><div class="bar m"></div><div class="bar s"></div><div class="bar"></div><div class="bar m"></div></div></html>';
}
function openPreview(n){
  const dlg = $('preview'), body = $('pvBody'), x = ext(n);
  clearTimeout(previewTimer); if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  body.replaceChildren();
  $('pvTitle').textContent = n.name; $('pvTitle').dir = 'auto';
  $('pvMeta').textContent = [x.toUpperCase(), fmtSize(n.size), fmtDate(n.modified), n.demo ? t('pv_demo_note') : ''].filter(Boolean).join(' · ');
  const open = $('pvOpen'), dl = $('pvDownload');
  open.classList.toggle('hidden', !!n.demo); dl.classList.toggle('hidden', !!n.demo || /^g(doc|slides|sheet)$/.test(x) || n.public === false);
  open.href = n.demo ? '#' : driveFileUrl(n.id); dl.href = n.demo ? '#' : driveDownloadUrl(n.id);
  const center = (icon, title, text) => el('div', {class:'frame-state'}, stateBox('', icon, title, text));
  if (n.public === false) body.append(center('🔒', t('restricted_t'), t('restricted_p')));
  else if (n.demo) body.append(el('iframe', {srcdoc:demoDoc(n), title:n.name, sandbox:''}));
  else {
    const frame = el('iframe', {src:drivePreviewUrl(n.id), title:n.name, allow:'autoplay', referrerpolicy:'strict-origin-when-cross-origin'});
    const slow = el('div', {class:'frame-note hidden', role:'status'}, el('span', {text:t('pv_slow')}), el('a', {class:'btn sm primary', href:driveFileUrl(n.id), target:'_blank', rel:'noopener noreferrer'}, t('open_drive')));
    frame.addEventListener('load', () => clearTimeout(previewTimer));
    previewTimer = setTimeout(() => slow.classList.remove('hidden'), CONFIG.PREVIEW_FALLBACK_MS);
    body.append(frame, slow);
  }
  if (!dlg.open) { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); }
}
function closePreview(){ const dlg = $('preview'); clearTimeout(previewTimer); $('pvBody').replaceChildren(); if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; } if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
$('pvClose').addEventListener('click', closePreview);
$('preview').addEventListener('close', () => { clearTimeout(previewTimer); $('pvBody').replaceChildren(); });
$('preview').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePreview(); });

/* ===== Language & theme ===== */
function applyLang(){
  const h = document.documentElement; h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'المكتبة الأكاديمية | اللجنة العلمية' : 'Academic Library | Scientific Committee';
  document.querySelectorAll('[data-t]').forEach((e) => (e.textContent = t(e.dataset.t)));
  document.querySelectorAll('[data-t-ph]').forEach((e) => (e.placeholder = t(e.dataset.tPh)));
  document.querySelectorAll('[data-t-aria]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.tAria)));
  document.querySelectorAll('[data-t-title]').forEach((e) => (e.title = t(e.dataset.tTitle)));
  $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', lang === 'ar' ? 'Switch to English' : 'التبديل إلى العربية');
  setTheme(document.documentElement.dataset.theme, true);
}
function setTheme(v, quiet){
  document.documentElement.dataset.theme = v;
  const lb = v === 'dark' ? t('light') : t('dark'); $('theme').replaceChildren(el('span', {'aria-hidden':'true', text:lb.slice(0, 2)}), el('span', {class:'lbl', text:lb.slice(2).trim()})); $('theme').setAttribute('aria-label', lb.slice(2).trim());
  const mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = v === 'dark' ? '#0b0e13' : '#e9e8e5';
  if (!quiet) try { localStorage.setItem('ee_library_theme', v); } catch (e) {}
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('ee_library_lang', lang); } catch (e) {} applyLang(); render(); };
$('goBack').onclick = () => { if ($('search').value) { $('search').value = ''; render(); return; } const tr = pathTo(currentId); if (currentId !== 'root' && tr.length > 1) go(tr[tr.length - 2]); else location.href = 'index.html'; };
let searchTimer; $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 120); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('search') && !$('preview').open) { e.preventDefault(); $('search').focus(); } });

applyLang();
load(false);
</script></body></html>
