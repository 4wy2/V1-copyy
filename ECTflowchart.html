/* =========================================================
   EE Study Plan — stylesheet
   Themes: "dark" = Midnight Ink (default), "light" = Stone (soft light)
   Layout: header → toolbar → map/list → footer; course panel docks
   on the side (desktop) or as a slim bar at the bottom (≤900px)
   ========================================================= */

/* ---------- 1. Tokens ---------- */
:root {
  color-scheme: dark;
  --bg: #0b0e13;
  --panel: #151a22;
  --map: #0b0e13;
  --map-dots: none;
  --line: #2b3039;
  --shell-bd: #2b3039;
  --text: #e8ecf2;
  --muted: #98a1b0;
  --name: #d6e0ee;
  --blue: #67b9e3;
  --green: #6cba8c;
  --gold: #d8b662;
  --edge: #526778;
  --edge2: #353e4a;
  --scroll: #394f69;
  --card: #151a22;
  --card-bd: #353e4a;
  --card-hover: #151a22;
  --btn: #151a22;
  --btn-bd: #2b3039;
  --btn-hover: #151a22;
  --ok-bd: #4ba27b;
  --ok-bg: #14261d;
  --cur-bg: #151a22;
  --active: #24313c;
  --rec-bg: #1b2933;
  --c-pre: #56c5f4;
  --c-co: #efc76b;
  --c-next: #8a95a5;
  --on-blue: #07202e;
  --toast-bg: #e1f5ec;
  --toast-fg: #0e3022;
  --shadow: #0009;
  --lo: 0.22;

  --pad: clamp(12px, 2vw, 24px);
  --radius: 8px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* map geometry (fixed canvas, scaled by script) */
  --card-w: 135px;
  --card-h: 85px;
  --card-gap: 45px;
  --row-gap: 75px;
  --year-bar: 60px;
  --sem-w: 100px;
}

/* "light" = Stone: soft off-white with warm grey, calm accents */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9e8e5;
  --panel: #efeeeb;
  --map: #ecebe8;
  --map-dots: radial-gradient(#d6d4cf 0.8px, transparent 0.8px);
  --line: #d9d7d2;
  --shell-bd: #d4d2cc;
  --text: #2b2d2f;
  --muted: #6c6a66;
  --name: #37393b;
  --blue: #2a6e6c;
  --green: #437c55;
  --gold: #977035;
  --edge: #9a9b97;
  --edge2: #d0cec8;
  --scroll: #c3c0ba;
  --card: #f4f3f1;
  --card-bd: #cfccc6;
  --card-hover: #f7f6f4;
  --btn: #f3f2ef;
  --btn-bd: #d2d0ca;
  --btn-hover: #f6f5f3;
  --ok-bd: #5c9470;
  --ok-bg: #e2eae2;
  --cur-bg: #f0e9de;
  --active: #e0e9e6;
  --rec-bg: #deeae7;
  --c-pre: #3a8583;
  --c-co: #b48a48;
  --c-next: #8e8c86;
  --on-blue: #f5f7f6;
  --toast-bg: #2b2d2f;
  --toast-fg: #f2f1ee;
  --shadow: #2b2d2f1f;
  --lo: 0.4;
}

/* ---------- 2. Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto;
  max-width: 1920px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button, select, .upload {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--btn-bd);
  border-radius: var(--radius);
  background: var(--btn);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
}
select { padding: 0 8px; }
button:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
a { color: var(--blue); }
.muted, small { color: var(--muted); }
[hidden] { display: none !important; }

@media (hover: hover) {
  button:not(:disabled):hover, select:hover, .upload:hover { border-color: var(--blue); background: var(--btn-hover); }
}

/* ---------- 3. Header ---------- */
header {
  padding: 12px var(--pad) 10px;
  padding-left: max(var(--pad), env(safe-area-inset-left));
  padding-right: max(var(--pad), env(safe-area-inset-right));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.mast { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; direction: ltr; }
.academic-heading { min-width: 0; }
h1 { margin: 0 0 3px; font-size: clamp(15px, 1.5vw, 18px); font-weight: 700; letter-spacing: 1.2px; line-height: 1.3; }
.subtitle { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); }
.subtitle span { padding: 0 8px; }
.mast-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tools { display: flex; gap: 8px; }
button.icon { min-width: 34px; padding: 0 10px; }
#themeBtn { display: inline-grid; place-items: center; overflow: hidden; }
#themeBtn svg { grid-area: 1 / 1; transition: transform 0.45s cubic-bezier(.4, 1.6, .5, 1), opacity 0.3s; }
#themeBtn .i-moon, :root[data-theme="light"] #themeBtn .i-sun { opacity: 0; transform: rotate(-90deg) scale(0.4); }
:root[data-theme="light"] #themeBtn .i-moon { opacity: 1; transform: none; }
html.theme-fade, html.theme-fade * {
  transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease !important;
}

.brand { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; white-space: nowrap; direction: ltr; color: var(--muted); }
.brand-by { font-size: 10px; letter-spacing: 0.8px; }
[dir="rtl"] .brand-by { letter-spacing: 0; font-size: 11px; }
/* Latin name reads larger than Ruqaa at the same size: scale it down to match */
:root[lang="en"] .brand-ar { font-size: 23px; }
.brand-ar { font: 700 30px/1.3 "Rassasi Brand", "Amiri", "Noto Naskh Arabic", serif; color: var(--blue); padding: 0 2px; }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .brand-ar {
    background: linear-gradient(100deg, var(--blue), var(--c-co));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
}

.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; }
.progress strong { font-weight: 600; }
.track { flex: 1 1 140px; max-width: 420px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { width: 0; height: 100%; border-radius: 99px; background: var(--green); transition: width 0.2s; }
#percent { font-weight: 700; color: var(--green); }

/* ---------- 4. Toolbar & mode bars ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 10px var(--pad);
  padding-left: max(var(--pad), env(safe-area-inset-left));
  padding-right: max(var(--pad), env(safe-area-inset-right));
}
.tb-find { display: flex; gap: 8px; flex: 1 1 260px; min-width: 0; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; min-width: 0; }
.search input {
  width: 100%; min-height: 34px; padding: 0 12px;
  border: 1px solid var(--btn-bd); border-radius: var(--radius);
  background: var(--btn); color: var(--text); font-size: 13px;
  -webkit-appearance: none; appearance: none;
}
.tb-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-inline-start: auto; }

.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--btn-bd); border-radius: var(--radius); background: var(--panel); }
.seg button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 0; background: transparent; color: var(--muted); }
.seg button + button { border-inline-start: 1px solid var(--btn-bd); }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--blue); font-weight: 600; }

.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); font-weight: 600; }
@media (hover: hover) { .primary:not(:disabled):hover { background: var(--blue); border-color: var(--blue); filter: brightness(1.08); } }
.primary[aria-pressed="true"] { outline: 2px solid var(--blue); outline-offset: 2px; }
#bulkToggle[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }

.bulkbar, .recommend-bar {
  display: flex; flex-wrap: wrap; align-items: center;
  margin: 0 var(--pad) 8px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); font-size: 12px;
}
.bulkbar { position: sticky; top: 0; z-index: 5; gap: 8px; }
.bulkbar strong { margin-inline-end: auto; font-size: 13px; }
.bulk-hours {
  padding: 5px 11px; border: 1px solid var(--edge2); border-radius: 7px;
  background: var(--active); color: var(--blue); font-size: 13px; font-weight: 700; white-space: nowrap;
}
.recommend-bar { gap: 12px; border-color: var(--edge); }
.recommend-bar label { display: flex; align-items: center; gap: 7px; }
.recommend-bar input { width: 18px; height: 18px; accent-color: var(--blue); }
.recommend-bar button { margin-inline-start: auto; }
.recommend-bar p { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 11px; }

/* ---------- 5. Map shell ---------- */
main {
  padding: 0 var(--pad) 14px;
  padding-left: max(var(--pad), env(safe-area-inset-left));
  padding-right: max(var(--pad), env(safe-area-inset-right));
}
.map-shell { min-width: 0; overflow: hidden; border: 1px solid var(--shell-bd); border-radius: 10px; background: var(--map); }
.map-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 51px; padding: 7px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 2px; margin-inline-end: 5px; vertical-align: middle; background: var(--c-pre); }
.legend i.co { background: var(--c-co); }
.map-controls { display: flex; align-items: center; gap: 5px; margin-inline-start: auto; flex-shrink: 0; direction: ltr; }
.zoom-control { min-width: 34px; padding: 0 8px; border-radius: 7px; font: 600 19px/1 system-ui, sans-serif; }
#zoomValue { min-width: 43px; text-align: center; font: 12px var(--mono); color: var(--muted); }

.viewport {
  height: clamp(420px, 68dvh, 790px);
  overflow: auto;
  overscroll-behavior: contain;
  touch-action: none;
  cursor: grab;
  direction: ltr;
  background-color: var(--map);
  background-image: var(--map-dots);
  background-size: 24px 24px;
  scrollbar-color: var(--scroll) var(--map);
}
.viewport:active { cursor: grabbing; }
.space { position: relative; }
.map {
  position: absolute; left: 0; top: 0;
  width: 1650px; padding: 26px 28px 36px;
  transform-origin: top left; direction: ltr;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#lines { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

.year { position: relative; display: flex; margin-bottom: 80px; padding-bottom: 60px; }
.year:last-child { margin-bottom: 0; padding-bottom: 0; }
.year:not(:last-child)::after {
  content: ""; position: absolute; left: 80px; right: 28px; bottom: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 86%, transparent);
}
.year-label {
  flex: none; width: var(--year-bar); padding-left: 12px;
  writing-mode: vertical-rl; transform: rotate(180deg); text-align: center;
  font-size: 17px; font-weight: 800; letter-spacing: 4px; color: var(--muted);
  border-left: 3px solid var(--edge);
  background: linear-gradient(0deg, transparent, var(--panel));
}
.year:nth-child(2) .year-label { color: var(--blue); border-left-color: var(--blue); }
.year:nth-child(3) .year-label { color: var(--green); border-left-color: var(--green); }
.year:nth-child(4) .year-label { color: var(--gold); border-left-color: var(--gold); }
.rows { display: flex; flex-direction: column; gap: var(--row-gap); min-width: 0; }
.row { display: flex; align-items: center; min-height: var(--card-h); padding-left: 30px; }
.semester {
  flex: none; width: var(--sem-w); padding-left: 14px;
  border-left: 2px solid var(--line);
  font: 700 12px var(--mono); letter-spacing: 1px; color: var(--muted);
}
.cards { display: flex; align-items: center; gap: var(--card-gap); }

/* ---------- 6. Course card ---------- */
.card {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  width: var(--card-w); min-width: var(--card-w); height: var(--card-h); padding: 7px 8px;
  border: 1px solid var(--card-bd); border-radius: var(--radius);
  background: var(--card); text-align: center;
  transition: border-color 0.15s, opacity 0.15s, box-shadow 0.15s;
}
@media (hover: hover) { .card:hover { border-color: var(--blue); background: var(--card-hover); } }
.card .code { font: 700 13px/1.2 var(--mono); color: var(--blue); }
.card .name { max-height: 28px; overflow: hidden; font-size: 10.5px; line-height: 1.25; color: var(--name); }
.card .badge { font-size: 9.5px; line-height: 1.15; color: var(--muted); }

.card.completed { border-color: var(--ok-bd); background: var(--ok-bg); }
.card.completed .code { color: var(--green); }
.card.current { border: 2px solid var(--gold); background: var(--cur-bg); }
.card.recommended { border: 2px solid var(--blue); background: var(--rec-bg); }
.card.recommended .badge { color: var(--blue); }
.card.selected { outline: 2px solid var(--blue); outline-offset: 2px; }
.card.rel-pre { box-shadow: 0 0 0 2px var(--c-pre); }
.card.rel-co { box-shadow: 0 0 0 2px var(--c-co); }
.card.rel-next { box-shadow: 0 0 0 2px var(--c-next); }
.card.fade { opacity: 0.2; }
.card.dimmed { opacity: 0.24; }
.card:focus-visible { z-index: 2; }

.bulk-mode .card::before {
  content: ""; position: absolute; top: 6px; right: 6px; width: 15px; height: 15px;
  border: 1px solid var(--muted); border-radius: 3px; background: var(--bg);
  font-size: 12px; line-height: 15px; text-align: center;
}
.bulk-mode .card.bulk-selected::before { content: "✓"; border-color: var(--blue); background: var(--blue); color: var(--on-blue); }
.card.bulk-selected { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- 7. List view ---------- */
body.list .viewport { height: auto; overflow: visible; touch-action: auto; cursor: auto; }
body.list .space { width: auto !important; height: auto !important; }
body.list .map { position: relative; width: auto; padding: 15px; transform: none !important; -webkit-user-select: auto; user-select: auto; }
body.list #lines, body.list .map-controls, body.list .legend > span:nth-child(-n + 2) { display: none; }
body.list .year { display: block; margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
body.list .year:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
body.list .year::after { display: none; }
body.list .year-label {
  width: auto; margin-bottom: 16px; padding: 0 0 6px 10px;
  writing-mode: horizontal-tb; transform: none; text-align: left; background: none;
}
body.list .rows { gap: 25px; }
body.list .row { display: block; padding: 0; }
body.list .semester { width: auto; margin-bottom: 12px; }
body.list .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; }
body.list .card { width: 100%; min-width: 0; height: 90px; }
body.list .card.dimmed { display: none; }

/* ---------- 8. Footer, empty, toast, dialog ---------- */
.empty { padding: 30px; text-align: center; color: var(--muted); }
.hint { margin: 8px 0; font-size: 11px; color: var(--muted); }
.footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; }
.footer summary { padding: 10px; cursor: pointer; }
.backup { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.upload { display: inline-flex; align-items: center; }

#toast {
  position: fixed; z-index: 20; left: 50%; bottom: calc(var(--dock-h, 0px) + 24px + env(safe-area-inset-bottom));
  max-width: 90%; padding: 12px 20px; border-radius: 12px;
  background: var(--toast-bg); color: var(--toast-fg); box-shadow: 0 8px 40px #0005;
  transform: translateX(-50%);
}
#toast:empty { display: none; }

dialog {
  width: min(520px, calc(100% - 24px)); max-height: 85dvh; padding: 18px; overflow: auto;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); color: var(--text);
}
dialog::backdrop { background: #02060dba; }
.dialog-head { display: flex; align-items: start; justify-content: space-between; gap: 15px; }
dialog h2 { margin: 6px 0; font-size: 18px; }
dialog p { margin: 8px 0; font-size: 13px; }

/* ---------- 9. Course panel (side dock on desktop) ---------- */
#detail {
  position: fixed; z-index: 15; inset-block: 0; inset-inline-start: 0;
  width: min(340px, 100%); padding: 16px; overflow: auto;
  background: var(--panel); border-inline-end: 1px solid var(--line);
  box-shadow: -10px 0 30px var(--shadow);
}
[dir="ltr"] #detail { box-shadow: 10px 0 30px var(--shadow); }
body.has-dock { padding-inline-start: min(340px, 100%); }
.d-head { display: flex; align-items: start; justify-content: space-between; gap: 15px; }
.eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--blue); }
#detail h2 { margin: 6px 0 2px; font-size: 19px; }
#detail h3 {
  margin: 14px 0 8px; padding-inline-start: 8px;
  border-inline-start: 3px solid var(--edge); font-size: 12px;
}
#detail h3.k-pre { border-inline-start-color: var(--c-pre); }
#detail h3.k-co { border-inline-start-color: var(--c-co); }
.states { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.states button { flex: 1; min-height: 32px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
.states .active { border-color: var(--blue); background: var(--active); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; direction: ltr; }
.chips { unicode-bidi: isolate; }
.chips button { min-height: 28px; padding: 2px 8px; font: 12px var(--mono); }
.rec-reason { margin: 10px 0; padding: 10px 12px; border-inline-start: 2px solid var(--blue); background: var(--active); font-size: 12px; }
#detail ul { margin: 6px 0 0; padding: 0 20px; font-size: 12px; color: var(--muted); }
#detail li { margin: 3px 0; }
#detail details { margin-top: 18px; font-size: 13px; }

  bulkMode = false;
  bulkIds.clear();
  updateBulk();
  refresh();
}
$("#bulkToggle").onclick = () => {
  if (bulkMode) endBulk();
  else {
    if (recommendMode) endRecommendations();
    bulkMode = true;
    selected = null;
    dock.hidden = true;
    document.body.classList.remove("has-dock");
    updateBulk();
    refresh();
  }
};
$("#bulkCancel").onclick = endBulk;
$("#bulkbar").addEventListener("click", (e) => {
  const b = e.target.closest("[data-bulk]");
  if (!b || !bulkIds.size) return;
  const n = bulkIds.size;
  for (const id of bulkIds) {
    if (b.dataset.bulk === "none") delete state[id];
    else state[id] = b.dataset.bulk;
  }
  save();
  bulkIds.clear();
  updateBulk();
  refresh();
  notify(t("n_bulk", n));
});
$("#years").addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (b) {
    if (bulkMode) {
      const id = b.dataset.id;
      if (bulkIds.has(id)) bulkIds.delete(id);
      else bulkIds.add(id);
      updateBulk();
      refresh();
    } else if (selected === b.dataset.id) closeDetail();
    else showCourse(b.dataset.id);

});
$("#detailBody").addEventListener("click", (e) => {
  const st = e.target.closest("[data-state]"),
    c = e.target.closest("[data-course]");
  if (st) {
    if (st.dataset.state === "none") delete state[selected];
    else state[selected] = st.dataset.state;
    save();
    showCourse(selected);
    notify(t("n_state"));
  }
  if (c) showCourse(c.dataset.course);
});
let recommendationCache = null;
function recommendations() {
  const cacheKey = `${stateRevision}:${$("#assume").checked}`;
  if (recommendationCache?.key === cacheKey) {
    recommended = recommendationCache.value;
    textIfChanged($("#recommendCount"), recommended.length ? t("rec_count", recommended.length) : t("rec_none"));
    return;
  }
  const done = new Set(courses.filter((c) => state[c.id] === "completed" || ($("#assume").checked && state[c.id] === "current")).map((c) => c.id));
  // Bundle co-requisites; a co-requisite's own pre-requisites must be met.
  function bundle(id, seen = new Set()) {
    if (done.has(id)) return seen;
    if (seen.has(id)) return seen;
    if (!eligible(id, done)) return null;
    seen.add(id);
    for (const co of incoming(id, "co")) if (!bundle(co, seen)) return null;
    return seen;
  }
  const memo = new Map();
  function depth(id, visited = new Set()) {
    if (visited.has(id)) return 0;
    const next = connections.filter((e) => e.from === id && e.type === "pre" && !done.has(e.to)).map((e) => e.to);
    return next.length ? 1 + Math.max(...next.map((n) => depth(n, new Set([...visited, id])))) : 0;
  }
  function scoreFor(id) {
    if (memo.has(id)) return memo.get(id);
    const downstream = [...descendants(id)].filter((x) => !done.has(x) && x !== id);
    const immediate = connections.filter((e) => e.from === id && e.type === "pre" && !done.has(e.to)).map((e) => e.to);
    const unlocked = immediate.filter((to) => incoming(to, "pre").every((pre) => done.has(pre) || pre === id)).length;
    const critical = depth(id);
    // Priority favors directly unlocking courses and longer prerequisite chains.
    const score = unlocked * 100 + critical * 25 + downstream.length * 5;
    const result = { score, unlocked, critical, downstream: downstream.length };
    memo.set(id, result);
    return result;
  }
  recommended = courses
    .filter((c) => !done.has(c.id))
    .map((c) => ({ c, group: bundle(c.id) }))
    .filter((x) => x.group !== null)
    .map(({ c, group }) => ({
      ...c,
      ...scoreFor(c.id),
      co: [...group].filter((id) => id !== c.id),
      score: [...descendants(c.id)].filter((id) => !done.has(id)).length,
    }))
    .sort(
      (a, b) => b.unlocked - a.unlocked || b.critical - a.critical || b.downstream - a.downstream || a.sem - b.sem || a.code.localeCompare(b.code),
    );
  recommendationCache = { key: cacheKey, value: recommended };
  $("#recommendCount").textContent = recommended.length ? t("rec_count", recommended.length) : t("rec_none");
}
function endRecommendations() {
  recommendMode = false;
  recommended = [];
  $("#recommendBar").hidden = true;
  $("#plan").setAttribute("aria-pressed", "false");
  refresh();
}
$("#plan").onclick = () => {
  if (recommendMode) {
    endRecommendations();
    return;
  }
  endBulk();
  if (!isPhone()) setView(false);
  $("#search").value = "";
  $("#filter").value = "all";
  recommendMode = true;
  $("#recommendBar").hidden = false;
  $("#plan").setAttribute("aria-pressed", "true");
  refresh();
  resize();
  requestAnimationFrame(() => {
    if (recommended.length) document.getElementById(recommended[0].id).scrollIntoView({ block: "center", behavior: scrollMotion() });
  });
};
$("#endRecommendations").onclick = endRecommendations;
$("#assume").onchange = refresh;
document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
new ResizeObserver(() => {
  document.documentElement.style.setProperty("--dock-h", dock.hidden || !isCompact() ? "0px" : dock.offsetHeight + "px");
  resize();
}).observe(dock);
$("#detailClose").onclick = closeDetail;
document.addEventListener("pointerdown", (e) => {
  if (dock.hidden || !isCompact()) return;
  if (e.target.closest("#detail, .card, dialog, header, .toolbar, .bulkbar, .recommend-bar, .map-head")) return;
  // On the map, a press may start a drag or pinch: keep the course selected.
  // A plain tap on empty map space still closes it (see the viewport click handler).
  if (!document.body.classList.contains("list") && e.target.closest("#viewport")) return;
  closeDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !dock.hidden && !document.querySelector("dialog[open]")) closeDetail();
});
$("#help").onclick = () => $("#helpDialog").showModal();
$("#search").oninput = () => {
  if (recommendMode) endRecommendations();
  else refresh();
};
$("#filter").onchange = () => {
  if (recommendMode) endRecommendations();
  else refresh();
};
function setView(list, remember) {
  resetGestures();
  flushCamera();
  geometryDirty = true;
  mapHeight = 0;
  if (remember)
    try {
      localStorage.setItem("ee_view", list ? "list" : "map");
    } catch {}
  document.body.classList.toggle("list", list);
  $("#viewMap").setAttribute("aria-pressed", !list);
  $("#viewList").setAttribute("aria-pressed", list);
}
$("#viewMap").onclick = () => {
  if (!document.body.classList.contains("list")) return;
  if (recommendMode) endRecommendations();
  setView(false, true);
  autoFit = true;
  refresh();
  resize();
};
$("#viewList").onclick = () => {
  if (document.body.classList.contains("list")) return;
  if (recommendMode) endRecommendations();
  setView(true, true);
  refresh();
  resize();
};
// One gesture owner for mouse/touch; preserve native wheel scrolling and list behavior.
const vp = $("#viewport"), pointers = new Map();
let pinch = null, drag = null, gestureMoved = false, suppressGestureClick = false;
function resetGestures() {
  for (const [id, point] of pointers) {
    if (point.target.hasPointerCapture(id)) point.target.releasePointerCapture(id);
  }
  pointers.clear();
  pinch = drag = null;
  gestureMoved = suppressGestureClick = false;
}
function beginGesture() {
  const points = [...pointers.values()], position = cameraPosition();
  if (points.length >= 2) {
    const [a, b] = points, rect = vp.getBoundingClientRect();
    const x = (a.x + b.x) / 2 - rect.left, y = (a.y + b.y) / 2 - rect.top;
    pinch = { distance: Math.hypot(a.x - b.x, a.y - b.y), scale,
      worldX: (position.left + x) / scale, worldY: (position.top + y) / scale, rect };
    gestureMoved = true;
  } else if (points.length) {
    drag = { ...points[0], left: position.left, top: position.top };
    pinch = null;
  }
}
vp.addEventListener("pointerdown", e => {
  if (document.body.classList.contains("list") || e.button !== 0) return;
  if (!pointers.size) {
    clearTimeout(revealTimer);
    flushCamera();
    vp.scrollTo({ left: vp.scrollLeft, top: vp.scrollTop, behavior: "instant" });
    gestureMoved = suppressGestureClick = false;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, target: e.target });
  // Capture on the pressed element: a tap must still click its course button.
  e.target.setPointerCapture(e.pointerId);
  beginGesture();
});
vp.addEventListener("pointermove", e => {
  const previous = pointers.get(e.pointerId);
  if (!previous) return;
  pointers.set(e.pointerId, { ...previous, x: e.clientX, y: e.clientY });
  if (pointers.size >= 2 && pinch?.distance > 0) {
    const [a, b] = [...pointers.values()];
    scale = Math.max(minScale(), Math.min(MAX_SCALE, pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.distance));
    autoFit = false;
    queueCamera(pinch.worldX * scale - ((a.x + b.x) / 2 - pinch.rect.left),
      pinch.worldY * scale - ((a.y + b.y) / 2 - pinch.rect.top));
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 6) gestureMoved = true;
    if (!gestureMoved) return;
    const left = drag.left - dx, top = drag.top - dy;
    const maxTop = Math.max(0, mapHeight * scale - vp.clientHeight);
    // Retain page scrolling when a touch drag reaches the map's vertical edge.
    if (e.pointerType !== "mouse") {
      const remainder = top - Math.max(0, Math.min(maxTop, top));
      const previousRemainder = drag.remainder || 0;
      if (Math.abs(remainder - previousRemainder) > .5) window.scrollBy(0, remainder - previousRemainder);
      drag.remainder = remainder;
    }
    queueCamera(left, top);
  }
});
function stopPointer(e) {
  if (!pointers.delete(e.pointerId)) return;
  flushCamera();
  if (gestureMoved) suppressGestureClick = true;
  if (pointers.size) beginGesture();
  else pinch = drag = null;
}
for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) vp.addEventListener(event, stopPointer);
window.addEventListener("blur", resetGestures);
vp.addEventListener("click", e => {
  if (suppressGestureClick && e.detail !== 0) {
    suppressGestureClick = false;
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  // A real tap (no drag/pinch) on empty map space closes the course bar on phones and tablets.
  if (!dock.hidden && isCompact() && !document.body.classList.contains("list") && !e.target.closest(".card")) closeDetail();
}, true);
vp.addEventListener("wheel", e => {
  if (document.body.classList.contains("list") || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vp.clientHeight : 1);
  setZoom(scale * Math.exp(-Math.max(-100, Math.min(100, delta)) * .002), e.clientX, e.clientY);
}, { passive: false });
$("#zoomIn").onclick = () => setZoom(scale * 1.2);
$("#zoomOut").onclick = () => setZoom(scale / 1.2);
$("#zoomFit").onclick = () => {
  autoFit = true;
  scale = fitScale();
  queueCamera(0, 0);
};

$("#export").onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 2, plan: "ect-28", state }, null, 2)], { type: "application/json" }),
    url = URL.createObjectURL(blob),
    a = document.createElement("a");
  a.href = url;
  a.download = "ECT_Progress.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify(t("n_export"));
};
$("#import").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    if (f.size > 1000000) throw Error();
    const data = JSON.parse(await f.text());
    let next;
    if (Array.isArray(data)) {
      if (!data.every((id) => valid.has(id))) throw Error();
      next = Object.fromEntries(data.map((id) => [id, "completed"]));
    } else {
      if (data.version !== 2 || data.plan !== "ect-28") throw Error();
      next = sanitize(data.state);
    }
    if (confirm(t("confirm"))) {
      state = next;
      save();
      refresh();
      notify(t("n_import"));
    }
  } catch {
    notify(t("n_bad"));
  }
  e.target.value = "";
};
$("#themeBtn").onclick = () => {
  theme = theme === "light" ? "dark" : "light";
  try {
    ["ee_theme_v3", "ee_theme", "ee_library_theme"].forEach((k) => localStorage.setItem(k, theme));
  } catch {}
  const swap = () => {
    applyTheme();
    refresh();
  };
  // Smooth colour change: crossfade where supported, otherwise a short CSS fade.
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) swap();
  else if (document.startViewTransition) document.startViewTransition(swap);
  else {
    const h = document.documentElement;
    h.classList.add("theme-fade");
    swap();
    setTimeout(() => h.classList.remove("theme-fade"), 450);
  }
};
$("#langBtn").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try {
    ["ee_lang", "ee_language", "ee_library_lang"].forEach((k) => localStorage.setItem(k, lang));
  } catch {}
  applyLang();
  if (selected) showCourse(selected);
  else refresh();
};
applyLang();
{
  let v = null;
  try {
    v = localStorage.getItem("ee_view");
  } catch {}
  setView(v === "list");
}
new ResizeObserver(() => {
  const height = $("#map").offsetHeight;
  if (height !== mapHeight) {
    mapHeight = height;
    geometryDirty = true;
    resize();
  }
}).observe($("#map"));
new ResizeObserver(resize).observe(vp);
window.addEventListener("resize", resize);
refresh();
resize();
