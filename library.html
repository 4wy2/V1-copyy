/* ---------- 2. Base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.8 var(--sans);-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button,a{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a{color:inherit;text-decoration:none}
.wrap{width:min(1160px,calc(100% - 32px));margin:auto}
.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0b1520;border-color:transparent;font-weight:750}
:root[data-theme="light"] .btn.primary{color:white}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.badge{font-size:11px;padding:3px 8px;border-radius:5px;background:var(--sub);color:var(--accent)}
.badge.demo{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.badge.lock{background:color-mix(in srgb,var(--bad) 15%,var(--panel));color:var(--bad)}
.arr{color:var(--muted)}
[dir="ltr"] .arr{transform:scaleX(-1)}

/* ---------- 3. Header ---------- */
.top{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--panel) 88%,transparent)}
.topin{display:flex;align-items:center;gap:16px;min-height:72px}
.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--sub);border:1px solid var(--line);border-radius:10px;color:var(--accent);font-family:var(--sans);font-weight:700;font-size:13px}
.brand{display:flex;gap:12px;align-items:center}
.brand strong{font-size:14.5px;display:block;font-weight:700}
.brand small{color:var(--muted)}
.topright{margin-inline-start:auto;display:flex;gap:8px}

/* ---------- 4. Hero & status ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px 40px;padding:52px 0 30px}
.eyebrow{color:var(--accent);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.18em}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.3;font-weight:700;margin:6px 0 10px}
.hero p{color:var(--muted);max-width:560px;margin:0;font-size:15.5px;line-height:1.9}
.hero-stats{margin:0;display:grid;grid-template-columns:repeat(3,auto);gap:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.hero-stats:empty{display:none}
.hero-stats div{display:grid;gap:0;padding:14px 22px;min-width:96px;text-align:center}
.hero-stats div+div{border-inline-start:1px solid var(--line)}
.hero-stats b{font:700 28px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:var(--text)}
.hero-stats span{font-size:12px;color:var(--muted)}
.modebar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.modebar b{color:var(--text)}
.modebar .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.modebar.off .dot{background:var(--bad)}
.modebar.demo{padding:10px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.modebar.demo .dot{background:var(--warn)}
.modebar .grow{min-width:0}
.modebar .btn.sm{min-height:28px;padding:2px 10px;font-size:12px;border-radius:9px}
.modebar .sync{font-size:12px;color:var(--muted)}

/* ---------- 5. Search & path ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0 4px}
.search{position:relative;flex:1;min-width:220px}
.search input{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 17px;padding-inline-start:44px;color:var(--text);width:100%;outline-offset:2px;-webkit-appearance:none;appearance:none;font-size:15px;min-height:54px;box-shadow:0 1px 0 var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search::before{content:"";position:absolute;inset-inline-start:16px;top:50%;width:15px;height:15px;transform:translateY(-58%);border:2px solid var(--muted);border-radius:50%;pointer-events:none}
.search::after{content:"";position:absolute;inset-inline-start:30px;top:calc(50% + 6px);width:7px;height:2px;background:var(--muted);transform:rotate(45deg);border-radius:2px;pointer-events:none}
[dir="rtl"] .search::after{transform:rotate(-45deg)}
.navrow{display:flex;align-items:center;gap:10px;margin:14px 0 18px;min-height:34px}
.navrow.root{display:none}
.navrow .back{min-width:34px;padding:0;border-radius:9px;font-size:15px}
[dir="ltr"] .navrow .back span{display:inline-block;transform:scaleX(-1)}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0;color:var(--muted);font-size:13px}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px;font-weight:500}
.crumbs button:last-child{color:var(--text);font-weight:700}
.crumbs .slash{opacity:.5}
.file .name,.folder strong,.crumbs button,#sectionTitle,#pvTitle{unicode-bidi:plaintext}

/* ---------- 6. Sections & cards ---------- */
.sectionline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sectionline h2{font-size:19px;font-weight:700;margin:0}
#sectionTitle{scroll-margin-top:88px}
.count{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards.depts{grid-template-columns:repeat(2,minmax(0,1fr))}
.dept{display:flex;align-items:center;gap:16px;text-align:start;padding:18px 20px;min-height:108px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;font:inherit;transition:border-color .15s,transform .15s,background-color .15s}
.dept:hover{border-color:var(--accent);transform:translateY(-1px)}
.dept .code{flex:none;min-width:60px;height:60px;padding:0 8px;display:grid;place-items:center;border-radius:10px;background:var(--sub);color:var(--accent);font:700 14px/1 var(--sans);letter-spacing:.05em}
.dept .copy{flex:1;min-width:0;display:grid;gap:3px}
.dept strong{font-size:15.5px;line-height:1.45;font-weight:600}
.dept small{color:var(--muted);font-size:12px;line-height:1.4}
.dept .stats{font-size:12px;color:var(--accent);font-weight:650}
.dept .stats.off{color:var(--bad)}
.dept.featured{grid-column:1/-1;min-height:136px;padding:24px 26px;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.dept.featured .code{min-width:76px;height:76px;font-size:18px;background:var(--accent);color:#0b1520}
:root[data-theme="light"] .dept.featured .code{color:#fff}
.dept.featured strong{font-size:21px;font-weight:700}
.dept.featured .stats{font-size:13px}
.folder{display:flex;text-align:start;gap:13px;align-items:center;min-height:88px;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel);color:var(--text);cursor:pointer;transition:border-color .15s,transform .15s}
.folder:hover{border-color:var(--accent);transform:translateY(-1px)}
.folder .ico{background:var(--sub);border-radius:10px;width:auto;min-width:48px;padding:0 9px;height:42px;flex:none;display:grid;place-items:center;color:var(--accent);font:700 11.5px/1 var(--sans);letter-spacing:.05em}
.folder .ico.empty{font-size:20px}
.folder .ico.icon{min-width:46px;height:46px}
.folder .ico svg{width:22px;height:22px}
.folder .copy{flex:1;min-width:0}
.folder strong{display:block;white-space:normal;line-height:1.45;font-size:14px;font-weight:600}
.folder small{display:block;color:var(--muted);margin-top:4px}
[dir="rtl"] .folder .copy strong,[dir="rtl"] .folder .copy small,[dir="rtl"] .file .name{text-align:right}
[dir="ltr"] .file .name{text-align:left}

/* ---------- 7. Files ---------- */
.files{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px;background:var(--panel)}
.files h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:13px 16px;font-size:13.5px;color:var(--text);font-weight:700;background:var(--card);border-bottom:1px solid var(--line)}
.recent{margin-top:30px}
.sortbar{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sortbar button{background:var(--panel);border:0;color:var(--muted);padding:5px 11px;font-size:12px;cursor:pointer;min-height:32px}
.sortbar button[aria-pressed="true"]{background:var(--sub);color:var(--accent);font-weight:700}
.file{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.files h3+.file{border-top:0}
.file .fico{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:600 10.5px/1 var(--mono);letter-spacing:.02em;background:var(--sub);color:var(--accent);text-transform:uppercase}
.fico.pdf{color:#e58a7d;background:color-mix(in srgb,#e58a7d 15%,var(--panel))}
.fico.doc{color:#7fa8e8;background:color-mix(in srgb,#7fa8e8 15%,var(--panel))}
.fico.ppt{color:#e5a35f;background:color-mix(in srgb,#e5a35f 15%,var(--panel))}
.fico.xls{color:#6fbf8e;background:color-mix(in srgb,#6fbf8e 15%,var(--panel))}
.fico.img{color:#b79be6;background:color-mix(in srgb,#b79be6 15%,var(--panel))}
.file .copy{flex:1;min-width:0}
.file .name{display:block;font-weight:600;line-height:1.45;overflow-wrap:anywhere;text-align:start}
.file button.name{width:100%;background:none;border:0;padding:0;color:var(--text);cursor:pointer}
.file button.name:hover{color:var(--accent)}
.file .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;margin-top:2px}
.file .meta .path{color:var(--accent)}
.file .acts{display:flex;gap:6px;flex:none}
.file .acts .btn.dl{min-width:42px}
.dlico{display:none}
.more-wrap{display:flex;justify-content:center;margin-top:14px}

/* ---------- 8. States ---------- */
.state{padding:38px 20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:8px}
.state .big{font-size:30px;line-height:1}
.state strong{color:var(--text);font-size:15px}
.state p{margin:0;max-width:520px}
.state.bad{border-style:solid;border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.skel{min-height:96px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,var(--panel) 25%,var(--card) 50%,var(--panel) 75%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- 9. Share & footer ---------- */
.share{display:flex;align-items:center;gap:18px;margin-top:22px;padding:20px 22px;border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.share .plus{flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:10px;background:var(--sub);color:var(--accent);font:700 28px/1 system-ui,sans-serif}
.share .copy{flex:1;min-width:0}
.share strong{display:block;font-size:16px;line-height:1.45;font-weight:700}
.share p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.share .btn{flex:none;padding-inline:20px}
.share.compact{margin-top:16px;padding:14px 16px}
.share.compact .plus{width:42px;height:42px;font-size:22px}
.share.compact strong{font-size:14.5px}
.howto-line{margin:34px 0 40px;text-align:center;color:var(--muted);font-size:12.5px}
footer{border-top:1px solid var(--line);padding:19px 0;color:var(--muted);font-size:12px}
footer .wrap{display:flex;justify-content:center;align-items:center}
[lang="en"] .sig{font:italic 600 21px/1.3 Georgia,"Times New Roman",serif;letter-spacing:.02em}
.sig{font:700 25px/1.3 "Rassasi Brand","Amiri","Noto Naskh Arabic",serif;color:var(--accent);padding:0 2px}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.sig{background:linear-gradient(100deg,var(--accent),var(--warn));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}

/* ---------- 10. Preview ---------- */
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.viewerbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.viewerbar strong{font-size:14px}
.viewerbar p{color:var(--muted);margin:2px 0 0;font-size:12px}
.view-actions{display:flex;gap:8px;flex-wrap:wrap}
.frame-wrap{position:relative;background:white}
.frame-wrap iframe{width:100%;height:min(660px,70vh);min-height:400px;display:block;border:0;background:#fff}
dialog.preview{padding:0;border:0;background:transparent;width:min(1100px,94vw);max-width:none;max-height:none;height:min(92dvh,900px);color:var(--text)}
dialog.preview::backdrop{background:#03070cc4}
dialog.preview .viewer{height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px var(--shadow)}
dialog.preview .viewerbar{flex:none}
dialog.preview .viewerbar>div:first-child{min-width:0;flex:1}
dialog.preview .viewerbar strong{display:block;overflow-wrap:anywhere}
dialog.preview .frame-wrap{flex:1;min-height:0;background:var(--card)}

function ingest(index){

    if (!n || typeof n.id !== 'string' || typeof n.parent !== 'string' || (n.kind !== 'file' && n.kind !== 'folder')) continue;
    if (isBlocked(n.name)) continue;

function getPublicIndexJsonp(url){

  if (n.demo) meta.append(el('span', {class:'badge demo', text:t('demo_badge')}));
  if (n.public === false) meta.append(el('span', {class:'badge lock', text:t('restricted')}));
  const acts = el('span', {class:'acts'},
    el('button', {type:'button', class:'btn sm', onclick:() => openPreview(n)}, t('preview')),
    n.demo ? null : el('a', {class:'btn sm dl', href:downloadUrl(n), target:'_blank', rel:'noopener noreferrer', 'aria-label':(isGoogleType(n) ? t('dl_pdf') : t('download')) + ' ' + n.name},
      el('span', {class:'lbl', text:isGoogleType(n) ? t('dl_pdf') : t('download')}), el('span', {class:'dlico', 'aria-hidden':'true', text:'↓'})));
  return el('div', {class:'file'},
    el('span', {class:'fico ' + kindClass(x), 'aria-hidden':'true', text:x.slice(0, 4)}),
    el('span', {class:'copy'}, el('button', {type:'button', class:'name', dir:'auto', onclick:() => openPreview(n)}, n.name), meta),
    acts);
}
function stateBox(kind, icon, title, text, actions){
  return el('div', {class:'state' + (kind === 'bad' ? ' bad' : ''), role: kind === 'bad' ? 'alert' : 'status'},
    el('span', {class:'big', 'aria-hidden':'true', text:icon}), el('strong', {text:title}), el('p', {text:text}), actions || null);
}
function renderModebar(){
  const mb = $('modebar'); mb.replaceChildren();
  let cls = 'modebar', html;
  if (CONFIG.MODE === 'demo') { cls += ' demo'; html = t('demo_bar'); }
  else if (store.status === 'ready' && store.offlineCopy) { cls += ' off'; html = t('saved_copy', fmtTime(store.generated)); }
  else if (store.status === 'ready' && store.syncing) html = t('saved_bar', fmtTime(store.generated));
  else if (store.status === 'ready') html = t('live_bar', fmtTime(store.generated));
  else { cls += ' off'; html = t('off_bar'); }
  mb.className = cls;
  const txt = el('span', {class:'grow'}); txt.innerHTML = html; // fixed strings only, no Drive data
  mb.append(el('span', {class:'dot', 'aria-hidden':'true'}), txt);
  if (store.syncing) mb.append(el('span', {class:'sync', text:t('syncing')}));
  if (store.status === 'ready' && store.truncated) { mb.classList.add('off'); mb.append(el('span', {class:'sync', text:t('truncated')})); }
  if (CONFIG.MODE === 'live' && store.status !== 'loading' && !store.syncing) mb.append(el('button', {type:'button', class:'btn sm', id:'refresh', onclick:() => load(true)}, t('refresh')));
  if (store.status === 'loading') mb.replaceChildren();
  renderHeroStats();
}
function render(){
  renderModebar();
  $('howto').textContent = t('howto');
  const cards = $('cards'), files = $('files'), state = $('state');
  cards.replaceChildren(); files.replaceChildren(); state.replaceChildren(); $('moreWrap')?.remove(); $('share').replaceChildren(); $('shareBottom').replaceChildren();
  cards.classList.remove('hidden', 'depts'); files.classList.add('hidden'); files.classList.remove('recent'); state.classList.add('hidden');
  const q = $('search').value.trim();

  // Breadcrumbs
  const crumbs = $('crumbs'); crumbs.replaceChildren();
  $('navrow').classList.toggle('root', currentId === 'root' && !q);
  document.body.classList.toggle('inside', currentId !== 'root' || !!q);
  const trail = store.status === 'ready' && (currentId === 'root' || store.byId.has(currentId) || ROOT_IDS.has(currentId)) ? pathTo(currentId) : ['root'];
  trail.forEach((id, i) => {
    if (i) crumbs.append(el('span', {class:'slash', text:'/'}));
    crumbs.append(el('button', {type:'button', dir:'auto', 'aria-current': i === trail.length - 1 ? 'page' : 'false', onclick:() => go(id)}, titleOf(id)));
  });

  const showState = (...a) => { cards.classList.add('hidden'); state.classList.remove('hidden'); state.append(stateBox(...a)); };
  const retry = el('button', {type:'button', class:'btn primary', onclick:() => load(true)}, t('retry'));

  if (store.status === 'loading') {
    $('sectionTitle').textContent = t('loading'); $('count').textContent = '';
    for (let i = 0; i < 6; i++) cards.append(el('div', {class:'skel', 'aria-hidden':'true'}));
    cards.setAttribute('aria-busy', 'true'); return;
  }
  cards.removeAttribute('aria-busy');
  if (store.status === 'error') {
    $('sectionTitle').textContent = t('depts'); $('count').textContent = '';
    const map = {network:['bad','⚠︎',t('net_t'),t('net_p'),retry], denied:['bad','🔒',t('denied_t'),t('denied_p'),null], config:['bad','⚙︎',t('cfg_t'),t('cfg_p'),null], bad:['bad','⚠︎',t('bad_t'),t('bad_p'),retry]};
    const picked = map[store.error] || map.network;
    return showState(picked[0], picked[1], picked[2], picked[3], picked[4]);
  }

  // Search across everything published
  if (q) {
    const nq = norm(q);
    const hit = (n) => norm(n.name).includes(nq) || (n.kind === 'file' && norm(pathTo(n.parent).map(titleOf).join(' ')).includes(nq));
    const all = [...store.byId.values()];
    const fol = all.filter((n) => n.kind === 'folder' && norm(n.name).includes(nq));
    const fil = all.filter((n) => n.kind === 'file' && hit(n));
    const deps = CONFIG.ROOTS.filter((r) => norm(r.ar + r.en + r.sub).includes(nq));
    $('sectionTitle').textContent = t('search_h');
    $('count').textContent = t('folders', fol.length + deps.length) + ' · ' + t('filesN', fil.length);
    deps.forEach((r) => cards.append(folderCard(r.id, r[lang], r.sub, null, r.sub.split('·')[0].trim())));
    fol.slice(0, searchLimit.folders).forEach((n) => cards.append(folderCard(n.id, n.name, pathTo(n.parent).slice(1).map(titleOf).join(' › '))));
    if (fil.length) { files.classList.remove('hidden'); fil.slice(0, searchLimit.files).forEach((n) => files.append(fileRow(n, true))); }
    if (fol.length > searchLimit.folders || fil.length > searchLimit.files)
      files.after(el('div', {class:'more-wrap', id:'moreWrap'}, el('button', {type:'button', class:'btn', onclick:() => { searchLimit.folders += 60; searchLimit.files += 100; render(); }}, t('show_more'))));
    if (!fol.length && !fil.length && !deps.length) showState('', '⌕', t('nores_t'), t('nores_p'));
    return;
  }

  // Root: departments
  if (currentId === 'root') {
    $('sectionTitle').textContent = t('depts'); $('count').textContent = '';
    cards.classList.add('depts');
    CONFIG.ROOTS.forEach((r, i) => cards.append(deptCard(r, i === 0)));
    const sc = shareCard(); if (sc) $('share').append(sc);
    const recent = [...store.byId.values()].filter((n) => n.kind === 'file' && n.modified)
      .sort((a, b) => String(b.modified).localeCompare(String(a.modified))).slice(0, matchMedia('(max-width:600px)').matches ? 4 : 8);
    if (recent.length) {
      files.classList.remove('hidden'); files.classList.add('recent');
      files.append(el('h3', {text:t('recent_h')}));
      recent.forEach((n) => files.append(fileRow(n, true)));
    }
    return;
  }

  // Unknown or filtered folder: never reveal whether it exists
  if (!ROOT_IDS.has(currentId) && !(store.byId.has(currentId) && store.byId.get(currentId).kind === 'folder')) {
    $('sectionTitle').textContent = t('denied_t'); $('count').textContent = '';
    return showState('bad', '🔒', t('denied_t'), t('denied_p'), el('button', {type:'button', class:'btn primary', onclick:() => go('root')}, t('home_btn')));
  }
  if (ROOT_IDS.has(currentId) && store.rootErrors.has(currentId)) {
    $('sectionTitle').textContent = titleOf(currentId); $('count').textContent = '';
    return showState('bad', '🔒', t('denied_t'), t('dept_unavailable'), retry);
  }

  const kids = store.kids.get(currentId) || [];
  const fol = kids.filter((n) => n.kind === 'folder'), fil = kids.filter((n) => n.kind === 'file');
  $('sectionTitle').textContent = titleOf(currentId);
  $('count').textContent = [fol.length ? t('folders', fol.length) : '', fil.length ? t('filesN', fil.length) : ''].filter(Boolean).join(' · ');
  fol.forEach((n) => { const sub = (store.kids.get(n.id) || []); const nf = sub.filter((x) => x.kind === 'folder').length, nfi = sub.length - nf;
    cards.append(folderCard(n.id, n.name, nf ? t('folders', nf) + (nfi ? ' · ' + t('filesN', nfi) : '') : nfi ? t('filesN', nfi) : t('open_folder'))); });
  if (!fol.length) cards.classList.add('hidden');
  if (fil.length) {
    const sorted = sortMode === 'new' ? fil.slice().sort((a, b) => String(b.modified || '').localeCompare(String(a.modified || ''))) : fil;
    const sb = (mode, label) => el('button', {type:'button', 'aria-pressed':String(sortMode === mode), onclick:() => { sortMode = mode; try { localStorage.setItem('ee_library_sort', mode); } catch (e) {} render(); }}, label);
    files.classList.remove('hidden');
    files.append(el('h3', {}, el('span', {text:t('files_h')}), fil.length > 1 ? el('span', {class:'sortbar', role:'group', 'aria-label':t('sort_aria')}, sb('name', t('sort_name')), sb('new', t('sort_new'))) : null));
    sorted.forEach((n) => files.append(fileRow(n, false)));
  }
  if (!kids.length) showState('', '📂', t('empty_t'), t('empty_p'));
  // Invite students to contribute, labelled with the course they are in.
  const course = pathTo(currentId).slice(1).map((id) => ROOT_IDS.has(id) ? '' : splitName(titleOf(id)).badge).filter((b) => b && !/^\d+$/.test(b))[0];
  const sc = shareCard(course || titleOf(currentId)); if (sc) $('shareBottom').append(sc);
}

/* ===== Preview ===== */
function demoDoc(n){
  // Demo preview is a small HTML page (works on every browser, unlike PDF-in-iframe on Android).
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ar = lang === 'ar';
  return '<!doctype html><html lang="' + lang + '" dir="' + (ar ? 'rtl' : 'ltr') + '"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>body{margin:0;background:#e9e8e5;font:15px/1.7 system-ui,sans-serif;color:#292e34;padding:24px}.page{max-width:720px;margin:auto;background:#fff;border-radius:6px;padding:40px 36px;box-shadow:0 2px 12px #0002}' +
    '.tag{display:inline-block;background:#f4e7cf;color:#7a5414;font-weight:700;font-size:12px;padding:3px 10px;border-radius:5px}h1{font-size:22px;margin:16px 0 6px;unicode-bidi:plaintext}p{color:#55606b}.bar{height:10px;background:#eceae5;border-radius:4px;margin:14px 0}.bar.s{width:70%}.bar.m{width:85%}</style>' +
    '<div class="page"><span class="tag">' + (ar ? 'معاينة تجريبية' : 'DEMO PREVIEW') + '</span><h1>' + esc(n.name) + '</h1><p>' +
    (ar ? 'هذا محتوى تجريبي مولّد داخل الصفحة وليس ملفًا حقيقيًا. في الوضع المباشر يظهر الملف الحقيقي هنا.' : 'This is generated sample content, not a real file. In live mode the real file appears here.') +
    '</p><div class="bar"></div><div class="bar m"></div><div class="bar s"></div><div class="bar"></div><div class="bar m"></div></div></html>';
}
function openPreview(n){
  const dlg = $('preview'), body = $('pvBody'), x = ext(n);
  body.replaceChildren();
  $('pvTitle').textContent = n.name; $('pvTitle').dir = 'auto';
  $('pvHelp').replaceChildren();
  $('pvMeta').textContent = [x.toUpperCase(), fmtSize(n.size), fmtDate(n.modified), n.demo ? t('pv_demo_note') : ''].filter(Boolean).join(' · ');
  const dl = $('pvDownload');
  dl.classList.toggle('hidden', !!n.demo || n.public === false);
  dl.href = n.demo ? '#' : downloadUrl(n);
  dl.textContent = isGoogleType(n) ? t('dl_pdf') : t('download');
  const center = (icon, title, text) => el('div', {class:'frame-state'}, stateBox('', icon, title, text));
  if (n.public === false) body.append(center('🔒', t('restricted_t'), t('restricted_p')));
  else if (n.demo) body.append(el('iframe', {srcdoc:demoDoc(n), title:n.name, sandbox:''}));
  else {
    const frame = el('iframe', {src:drivePreviewUrl(n.id), title:n.name, allow:'autoplay', referrerpolicy:'strict-origin-when-cross-origin'});
    // The iframe can't tell us whether Google actually showed the file, so a quiet, permanent
    // hint under the title offers the download; it never covers the document.
    $('pvHelp').replaceChildren(t('pv_help') + ' ', el('a', {href:downloadUrl(n), target:'_blank', rel:'noopener noreferrer'}, t('pv_dl_link')));
    body.append(frame);
  }
  if (!dlg.open) { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); }
}
function closePreview(){ const dlg = $('preview'); $('pvBody').replaceChildren(); if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
$('pvClose').addEventListener('click', closePreview);
$('preview').addEventListener('close', () => { $('pvBody').replaceChildren(); });
$('preview').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePreview(); });

/* ===== Language & theme ===== */
function applyLang(){
  const h = document.documentElement; h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'المكتبة الأكاديمية | اللجنة العلمية' : 'Academic Library | Scientific Committee';
  document.querySelectorAll('[data-t]').forEach((e) => (e.textContent = t(e.dataset.t)));
  document.querySelectorAll('[data-t-ph]').forEach((e) => (e.placeholder = t(e.dataset.tPh)));
  document.querySelectorAll('[data-t-aria]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.tAria)));
  document.querySelectorAll('[data-t-title]').forEach((e) => (e.title = t(e.dataset.tTitle)));
  $('lang').textContent = t('lang'); $('lang').setAttribute('aria-label', lang === 'ar' ? 'Switch to English' : 'التبديل إلى العربية');
  setTheme(document.documentElement.dataset.theme, true);
}
function setTheme(v, quiet){
  document.documentElement.dataset.theme = v;
  const lb = v === 'dark' ? t('light') : t('dark'); $('theme').replaceChildren(el('span', {'aria-hidden':'true', text:lb.slice(0, 2)}), el('span', {class:'lbl', text:lb.slice(2).trim()})); $('theme').setAttribute('aria-label', lb.slice(2).trim());
  const mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = v === 'dark' ? '#0b0e13' : '#e9e8e5';
  if (!quiet) try { ['ee_library_theme','ee_theme','ee_theme_v3'].forEach((k) => localStorage.setItem(k, v)); } catch (e) {}
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { ['ee_library_lang','ee_language','ee_lang'].forEach((k) => localStorage.setItem(k, lang)); } catch (e) {} applyLang(); render(); };
$('goBack').onclick = () => { if ($('search').value) { $('search').value = ''; if (!syncSearchToUrl()) render(); return; } const tr = pathTo(currentId); if (currentId !== 'root' && tr.length > 1) go(tr[tr.length - 2]); else location.href = 'index.html'; };
let searchTimer; $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchLimit = {folders:60, files:100}; searchTimer = setTimeout(() => { if (!syncSearchToUrl()) render(); }, 150); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('search') && !$('preview').open) { e.preventDefault(); $('search').focus(); } });

applyLang();
