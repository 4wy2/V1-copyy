    html[data-theme="light"] {
      color-scheme: light;
      --bg: #e9e8e5; --card: #f3f2ef; --card-2: #faf9f7; --line: #d5d2cb;
      --text: #292e34; --muted: #5e6772; --accent: #2a6e6c; --accent-hover: #235c5a; --accent-text: #ffffff;
      --icon: #2a6e6c; --bolt: #2a6e6c; --sub: #dceae6; --gold: #94641c; --ok: #367c55; --bad: #a8473a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.65;
      transition: background-color .2s, color .2s;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    h1, h2, h3, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .wrap { width: min(100% - 2rem, 480px); margin-inline: auto; }

    .topbar { padding-block: 1rem .25rem; }
    .topbar-inner { display: flex; align-items: center; gap: .6rem; }
    .brand { display: flex; align-items: center; gap: .65rem; min-width: 0; }
    .brand strong { display: block; font-size: .95rem; font-weight: 700; line-height: 1.35; }
    .brand small { display: block; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .brand-mark, .icon-btn {
      flex: none; height: 38px; min-width: 38px; padding: 0 .65rem; display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      font-size: .82rem; font-weight: 700; cursor: pointer; transition: border-color .15s;
    }
    .brand-mark { width: 38px; padding: 0; background: var(--sub); color: var(--accent); font-size: 13px; cursor: default; }
    .icon-btn:hover { border-color: var(--muted); }
    .prefs { display: flex; gap: .4rem; margin-inline-start: auto; }

    main { flex: 1; padding-block: .75rem 2rem; display: grid; gap: .75rem; align-content: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem 1.1rem; }
    .lookup { text-align: center; }
    .lookup h1 { font-size: 1.2rem; font-weight: 700; }
    .lookup > p { margin-top: .25rem; color: var(--muted); font-size: .84rem; }
    form { display: grid; gap: .6rem; margin-top: 1rem; }
    input {
      width: 100%; min-height: 48px; padding: .5rem .9rem; text-align: center;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; direction: ltr;
    }
    input::placeholder { color: var(--muted); font-size: .9rem; font-weight: 600; letter-spacing: 0; }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 44px; padding: .5rem 1rem; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); font-size: .88rem; font-weight: 700; transition: background-color .15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-outline { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
    .btn-outline:hover { background: var(--card-2); border-color: var(--accent); }
    .btn-outline i { color: var(--icon); }

    .results { display: grid; gap: .6rem; }
    .results:empty { display: none; }
    .count { color: var(--muted); font-size: .8rem; text-align: center; }
    .cert { display: grid; gap: .75rem; padding: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .cert-head { display: flex; align-items: center; gap: .7rem; }
    .cert-icon { flex: none; width: 38px; height: 38px; display: grid; place-items: center; background: var(--card-2); border-radius: 10px; color: var(--icon); }
    .cert h2 { font-size: .92rem; font-weight: 700; line-height: 1.5; unicode-bidi: plaintext; text-align: start; }
    .cert .btn { width: 100%; }
    .cert .note { font-size: .76rem; color: var(--muted); text-align: center; }
    .msg { padding: 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: center; font-size: .86rem; color: var(--muted); }
    .msg.bad { color: var(--bad); }
    .msg i { display: block; margin-bottom: .3rem; font-size: 1.1rem; }

    .footer { border-top: 1px solid var(--line); padding-block: 1.2rem 1.6rem; text-align: center; }
    .footer p { color: var(--muted); font-size: .76rem; }
    .credit { display: inline-block; margin-top: .3rem; color: var(--muted); font-size: .76rem; font-weight: 700; }
    .credit:hover { color: var(--text); }
    .sig { font: 700 25px/1.3 "Rassasi Brand", "Amiri", "Noto Naskh Arabic", serif; color: var(--accent); padding: 0 2px; }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .sig { background: linear-gradient(100deg, var(--accent), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    }
    html[lang="en"] .sig { font: italic 600 21px/1.3 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
    .footer .credit { margin-top: .5rem; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="icon-btn" href="index.html" data-i18n-aria="home" aria-label="الرئيسية"><i class="fa-solid fa-house" aria-hidden="true"></i></a>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">EE</span>
        <div>
          <strong data-i18n="brand">شهادات النادي</strong>
          <small data-i18n="club">نادي الهندسة الكهربائية</small>
        </div>
      </div>
      <div class="prefs">
        <button id="languageToggle" class="icon-btn" type="button">EN</button>
        <button id="themeToggle" class="icon-btn" type="button"><i class="fa-solid fa-sun" aria-hidden="true"></i></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card lookup">
      <h1 data-i18n="title">استعلام الشهادات</h1>
      <p data-i18n="intro">اكتب رقمك الأكاديمي لعرض شهادات الدورات والفعاليات اللي حضرتها مع النادي.</p>
      <form id="lookupForm" novalidate>
        <input id="studentId" name="id" type="text" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="الرقم الأكاديمي" aria-label="الرقم الأكاديمي" data-i18n-ph="idLabel" data-i18n-aria="idLabel" />
        <button id="searchBtn" class="btn" type="submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span data-i18n="search">عرض الشهادات</span></button>
      </form>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p data-i18n="disclaimer">هذا الموقع مبادرة طلابية مساعدة وليس جهة رسمية.</p>
      <span class="credit"><span class="sig" data-i18n="creditName">الرصاصي</span></span>
    </div>
  </footer>

  <script>
  (() => {
    // رابط الـ Worker في Cloudflare اللي يرجّع شهادات الرقم الأكاديمي
    const API_BASE = 'https://square-lab-a7a0.mohammed-rasasi.workers.dev/';

    const copy = {
      ar: {
        pageTitle: 'شهادات النادي | نادي الهندسة الكهربائية', home: 'الرئيسية',
        brand: 'شهادات النادي', club: 'نادي الهندسة الكهربائية',
        title: 'استعلام الشهادات', intro: 'اكتب رقمك الأكاديمي لعرض شهادات الدورات والفعاليات اللي حضرتها مع النادي.',
        idLabel: 'الرقم الأكاديمي', search: 'عرض الشهادات', searching: 'جارٍ البحث…',
        empty: 'اكتب رقمك الأكاديمي أولاً.', invalid: 'الرقم الأكاديمي يكون أرقام فقط.',
        notFound: 'ما لقينا شهادات لهذا الرقم. تأكد من الرقم، وإذا حضرت فعالية حديثاً فممكن ما انضافت شهادتها بعد.',
        netError: 'تعذّر الاتصال. تأكد من الإنترنت وحاول مرة ثانية.',
        found: (n) => n === 1 ? 'شهادة واحدة' : n === 2 ? 'شهادتان' : n + ' شهادات',
        download: 'تحميل الشهادة (PDF)', preparing: 'جارٍ تجهيز الملف…', saved: 'تم التحميل',
        openInstead: 'تعذّر التحميل المباشر، فتحنا الشهادة في صفحة جديدة.', open: 'فتح الشهادة',
        disclaimer: 'هذا الموقع مبادرة طلابية مساعدة وليس جهة رسمية.', creditName: 'الرصاصي',
        langLabel: 'Switch to English', toLight: 'الوضع الفاتح', toDark: 'الوضع الداكن'
      },
      en: {
        pageTitle: 'Club certificates | Electrical Engineering Club', home: 'Home',
        brand: 'Club certificates', club: 'Electrical Engineering Club',
        title: 'Find your certificates', intro: 'Enter your academic ID to see certificates for the courses and events you attended with the club.',
        idLabel: 'Academic ID', search: 'Show certificates', searching: 'Searching…',
        empty: 'Enter your academic ID first.', invalid: 'The academic ID should contain digits only.',
        notFound: 'No certificates found for this ID. Check the number; if the event was recent, its certificate may not be added yet.',
        netError: 'Could not connect. Check your internet and try again.',
        found: (n) => n === 1 ? '1 certificate' : n + ' certificates',
        download: 'Download certificate (PDF)', preparing: 'Preparing file…', saved: 'Downloaded',
        openInstead: 'Direct download failed, so the certificate opened in a new tab.', open: 'Open certificate',
        disclaimer: 'This is a student-led initiative, not an official institution website.', creditName: 'Al-Rasasi',
        langLabel: 'التبديل إلى العربية', toLight: 'Light mode', toDark: 'Dark mode'
      }
    };

    const root = document.documentElement;
    const form = document.getElementById('lookupForm');
    const input = document.getElementById('studentId');
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');
    const langBtn = document.getElementById('languageToggle');
    const themeBtn = document.getElementById('themeToggle');
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let lang = root.lang === 'en' ? 'en' : 'ar';
    let theme = root.dataset.theme === 'light' ? 'light' : 'dark';
    let lastState = null; // يعاد رسمه عند تغيير اللغة
    let busy = false;
    const t = (k) => copy[lang][k];

    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    function el(tag, attrs, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      }
      kids.flat().forEach((c) => c != null && n.append(c.nodeType ? c : document.createTextNode(c)));
      return n;
    }
    const icon = (name, extra = '') => el('i', { class: 'fa-solid ' + name + ' ' + extra, 'aria-hidden': 'true' });

    function applyLang() {
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      root.dataset.theme = theme;
      document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach((n) => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
      document.querySelectorAll('[data-i18n-ph]').forEach((n) => { n.placeholder = t(n.dataset.i18nPh); });
      langBtn.textContent = lang === 'ar' ? 'EN' : 'ع';
      langBtn.setAttribute('aria-label', t('langLabel'));
      themeBtn.replaceChildren(icon(theme === 'dark' ? 'fa-sun' : 'fa-moon'));
      themeBtn.setAttribute('aria-label', theme === 'dark' ? t('toLight') : t('toDark'));
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#151a22' : '#f3f2ef';
      document.title = t('pageTitle');
      if (busy) searchBtn.querySelector('span').textContent = t('searching');
      if (lastState) show(lastState);
    }

    function message(key, bad, iconName) {
      return el('div', { class: 'msg' + (bad ? ' bad' : '') }, icon(iconName), t(key));
    }

    function show(state) {
      lastState = state;
      if (state.type === 'list') {
        results.replaceChildren(
          el('p', { class: 'count' }, t('found')(state.items.length)),
          ...state.items.map(certCard)
        );
      } else {
        const map = { notFound: [false, 'fa-folder-open'], netError: [true, 'fa-wifi'], empty: [true, 'fa-circle-info'], invalid: [true, 'fa-circle-info'] };
        const [bad, ic] = map[state.type];
        results.replaceChildren(message(state.type, bad, ic));
      }
    }

    function fileNameFor(course) {
      const safe = String(course || 'certificate').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80);
      return (safe || 'certificate') + '.pdf';
    }

    function certCard(cert) {
      const note = el('p', { class: 'note', hidden: '' });
      const label = el('span', {}, t('download'));
      const btn = el('button', { class: 'btn', type: 'button' }, icon('fa-file-pdf'), label);
      btn.addEventListener('click', () => download(cert, btn, label, note));
      return el('article', { class: 'cert' },
        el('div', { class: 'cert-head' }, el('span', { class: 'cert-icon', 'aria-hidden': 'true' }, icon('fa-award')), el('h2', {}, cert.course)),
        btn,
        el('a', { class: 'btn btn-outline', href: cert.url, target: '_blank', rel: 'noopener noreferrer' }, icon('fa-arrow-up-right-from-square'), t('open')),
        note);
    }

    async function download(cert, btn, label, note) {
      // الآيفون يتعامل مع ملفات PDF بفتحها، ومنها يقدر الطالب يحفظها أو يشاركها
      if (isIOS) { window.open(cert.url, '_blank', 'noopener'); return; }
      btn.disabled = true;
      label.textContent = t('preparing');
      note.hidden = true;
      try {
        const res = await fetch(cert.url);
        if (!res.ok) throw new Error('http ' + res.status);
        const blob = await res.blob();
        const href = URL.createObjectURL(blob);
        const a = el('a', { href, download: fileNameFor(cert.course) });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(href), 4000);
        label.textContent = t('saved');
        setTimeout(() => { label.textContent = t('download'); }, 2500);
      } catch (e) {
        window.open(cert.url, '_blank', 'noopener');
        note.textContent = t('openInstead');
        note.hidden = false;
        label.textContent = t('download');
      } finally {
        btn.disabled = false;
      }
    }

    function validItems(data) {
      if (!Array.isArray(data)) return [];
      return data.filter((c) => c && typeof c.course === 'string' && typeof c.url === 'string' && /^https:\/\//i.test(c.url));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      const id = input.value
        .replace(/[٠-٩]/g, (ch) => String(ch.charCodeAt(0) - 0x0660))
        .replace(/[۰-۹]/g, (ch) => String(ch.charCodeAt(0) - 0x06F0))
        .replace(/\s+/g, '');
      input.value = id;
      if (!id) { show({ type: 'empty' }); input.focus(); return; }
      if (!/^\d{1,20}$/.test(id)) { show({ type: 'invalid' }); input.focus(); return; }

      busy = true;
      searchBtn.disabled = true;
      searchBtn.querySelector('span').textContent = t('searching');
      searchBtn.querySelector('i').className = 'fa-solid fa-circle-notch spin';
      results.replaceChildren();
      lastState = null;
      try {
        const res = await fetch(API_BASE + encodeURIComponent(id));
        if (!res.ok) { show({ type: 'notFound' }); return; }
        const items = validItems(await res.json().catch(() => null));
        show(items.length ? { type: 'list', items } : { type: 'notFound' });
      } catch (err) {
        show({ type: 'netError' });
      } finally {
        busy = false;
        searchBtn.disabled = false;
        searchBtn.querySelector('span').textContent = t('search');
        searchBtn.querySelector('i').className = 'fa-solid fa-magnifying-glass';
      }
    });

    langBtn.addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; ['ee_language','ee_lang','ee_library_lang'].forEach((k) => save(k, lang)); applyLang(); });
    themeBtn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; ['ee_theme','ee_theme_v3','ee_library_theme'].forEach((k) => save(k, theme)); applyLang(); });

    applyLang();
  })();
  </script>
</body>
</html>
